name: Research Minimal Goto Scalar Codegen

on:
  push:
    branches:
      - research/second-boundary-provenance
    paths:
      - .github/workflows/research-minimal-goto-scalar-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    name: ${{ matrix.compiler }} / ${{ matrix.scalar }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0
        scalar:
          - int
          - long
          - float
          - double

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Capture scalar codegen
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/minimal-goto-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}"
          python3 benchmarks/run_segment_polygon_scalar_codegen_compare.py \
            --base=92659a9b330f3fdf248994cc9b598b6fe73f8429 \
            --candidate=d8d12abf7d50278716860984ffaca51f3f950266 \
            --compiler="$DC" \
            --scalar="${{ matrix.scalar }}" \
            --output="$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: minimal-goto-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}
          path: build/minimal-goto-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}
          if-no-files-found: error
          retention-days: 14
