name: Research Post Early-Out Split Codegen

on:
  push:
    branches:
      - research/second-boundary-provenance
    paths:
      - source/geo/internal/segment_polygon_clip_p1.d
      - .github/workflows/research-post-earlyout-split-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    name: ${{ matrix.compiler }} / ${{ matrix.scalar }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: dmd-2.111.0
            scalar: double
          - compiler: ldc-1.41.0
            scalar: int
          - compiler: ldc-1.41.0
            scalar: long
          - compiler: ldc-1.41.0
            scalar: float
          - compiler: ldc-1.41.0
            scalar: double

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Capture scalar codegen
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/post-earlyout-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}"
          python3 benchmarks/run_segment_polygon_scalar_codegen_compare.py \
            --base=92659a9b330f3fdf248994cc9b598b6fe73f8429 \
            --candidate=4dd07536453d33a722168134e65c75e97b96e8df \
            --compiler="$DC" \
            --scalar="${{ matrix.scalar }}" \
            --output="$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: post-earlyout-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}
          path: build/post-earlyout-codegen-${{ matrix.compiler }}-${{ matrix.scalar }}
          if-no-files-found: error
          retention-days: 14
