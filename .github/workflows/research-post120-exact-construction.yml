name: Research Post-120 Exact Construction Attribution

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-build:
    name: Probe build / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Compile and smoke-run attribution probe
        shell: bash
        run: |
          set -euxo pipefail
          python3 benchmarks/run_post120_exact_construction.py \
            --compiler="$DC" \
            --cpu=0 \
            --rounds=1 \
            --target-ms=1 \
            --output=build/post120-exact-construction-smoke
