name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Run unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Run lifetime compile-negative tests
        shell: bash
        run: bash tests/compile-negative/run.sh "$DC"

      - name: Run external consumer test
        shell: bash
        run: |
          cd tests/consumer
          dub run --compiler="$DC" --force

      - name: Verify and build consumer archive
        shell: bash
        run: bash tests/consumer-archive/run.sh "$DC"

      - name: Run 2D/3D family coexistence test
        shell: bash
        run: bash tests/family-consumer/run.sh "$DC"

      - name: Build release configuration
        shell: bash
        run: dub build --build=release --compiler="$DC" --force

      - name: Check determinant kernel decomposition probe
        if: matrix.compiler == 'dmd-2.111.0' || matrix.compiler == 'ldc-1.41.0'
        shell: bash
        run: |
          flags=(-O -release -boundscheck=off)
          if [[ "$DC" == *dmd* ]]; then
            flags+=(-inline)
          fi
          "$DC" "${flags[@]}" \
            -Isource \
            benchmarks/determinant_kernel_decomposition_bench.d \
            source/geo/internal/dyadic.d \
            source/geo/internal/fixed_uint.d \
            source/geo/internal/orientation_dyadic.d \
            -of=build/determinant-kernel-decomposition-probe
          build/determinant-kernel-decomposition-probe
          "$DC" "${flags[@]}" \
            -Isource \
            benchmarks/dyadic_product_subtraction_decomposition_bench.d \
            source/geo/internal/dyadic.d \
            source/geo/internal/fixed_uint.d \
            -of=build/dyadic-product-subtraction-decomposition-probe
          build/dyadic-product-subtraction-decomposition-probe
          "$DC" "${flags[@]}" \
            -Isource \
            benchmarks/fixed_uint_subtract_codegen.d \
            source/geo/internal/dyadic.d \
            source/geo/internal/fixed_uint.d \
            -of=build/fixed-uint-subtract-codegen-probe
          build/fixed-uint-subtract-codegen-probe

      - name: Check segment-polygon benchmark preflight and recording
        shell: bash
        run: python3 benchmarks/run_segment_polygon.py --compiler="$DC" --smoke

      - name: Check native GEOS clipping comparison preflight and recording
        if: matrix.compiler == 'dmd-2.111.0'
        shell: bash
        run: |
          python3 -m venv build/native-geos-venv
          build/native-geos-venv/bin/pip install --only-binary=:all: -r benchmarks/segment-polygon/reference/requirements.txt
          build/native-geos-venv/bin/python benchmarks/segment-polygon/reference/prepare_geos_wheel.py --output=build/native-geos-headers
          GEOS_NATIVE_LIB=$(python3 -c 'import json; print(json.load(open("build/native-geos-headers/installation.json"))["library"])')
          python3 benchmarks/segment-polygon/reference/run_native_comparison.py --compiler="$DC" --geos-header=build/native-geos-headers/geos_c.h --geos-library="$GEOS_NATIVE_LIB" --smoke --output=build/native-geos-smoke
          python3 benchmarks/segment-polygon/reference/analyze_native_record.py build/native-geos-smoke

      - name: Build and verify public API documentation
        if: matrix.compiler == 'dmd-2.111.0'
        shell: bash
        run: bash tools/build-docs.sh

  canary:
    name: Canary / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-latest
          - ldc-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Run unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Run lifetime compile-negative tests
        shell: bash
        run: bash tests/compile-negative/run.sh "$DC"

      - name: Run external consumer test
        shell: bash
        run: |
          cd tests/consumer
          dub run --compiler="$DC" --force

      - name: Run 2D/3D family coexistence test
        shell: bash
        run: bash tests/family-consumer/run.sh "$DC"

      - name: Build release configuration
        shell: bash
        run: dub build --build=release --compiler="$DC" --force

      - name: Build and verify public API documentation
        if: matrix.compiler == 'dmd-latest'
        shell: bash
        run: bash tools/build-docs.sh
