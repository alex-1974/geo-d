name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-latest
          - ldc-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Run unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Run lifetime compile-negative tests
        shell: bash
        run: bash tests/compile-negative/run.sh "$DC"

      - name: Run external consumer test
        shell: bash
        run: |
          cd tests/consumer
          dub run --compiler="$DC" --force

      - name: Build release configuration
        shell: bash
        run: dub build --build=release --compiler="$DC" --force

  portability-gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64 / LDC latest
            os: ubuntu-24.04-arm
          - name: Windows x64 / LDC latest
            os: windows-latest
          - name: macOS Intel / LDC latest
            os: macos-15-intel
          - name: macOS ARM64 / LDC latest
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Platform and compiler information
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a || true
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Run unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Run external consumer test
        shell: bash
        working-directory: tests/consumer
        run: dub run --compiler="$DC" --force

      - name: Build release configuration
        shell: bash
        run: dub build --build=release --compiler="$DC" --force


  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest

      - name: Compiler versions
        shell: bash
        run: |
          dmd --version
          dub --version

      - name: Build and verify public API documentation
        shell: bash
        run: bash tools/build-docs.sh
